version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nido-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nido_user
      POSTGRES_PASSWORD: nido_password
      POSTGRES_DB: nido_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nido-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: nido-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    container_name: nido-backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nido_user:nido_password@db:5432/nido_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: nido-blobs
      JWT_SECRET: supersecretrelaykeythatislongenough256bit
      JWT_ALGORITHM: HS256

volumes:
  postgres_data:
  redis_data:
  minio_data:
